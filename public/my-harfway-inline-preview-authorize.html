<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MY HARF-WAY — Preview</title><style>:root{--bg:#0b0c0e;--panel:#14161a;--line:#353941;--text:#f5f6f0;--muted:#969da6;--lime:#eaff3f}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{width:min(500px,calc(100% - 28px));margin:auto;padding:34px 0}.ey{font:900 10px ui-monospace;letter-spacing:.15em;color:var(--lime)}h1{font-size:40px;line-height:1;margin:12px 0}.lead{color:var(--muted);font-size:13px;line-height:1.8}.card{margin-top:20px;border:1px solid var(--line);background:var(--panel);padding:20px}.title{font-size:23px;font-weight:900;margin:0 0 8px}.note{font-size:12px;line-height:1.7;color:var(--muted)}button{width:100%;margin-top:16px;border:1px solid var(--lime);background:var(--lime);color:#111;padding:14px;font:900 13px inherit;cursor:pointer}.sub{font-size:10px;color:#747b84;line-height:1.7;margin-top:14px}</style></head><body><main class="wrap"><div class="ey">SAFE PREVIEW / NO DATABASE WRITE</div><h1 id="heading">持ち帰りを確認。</h1><p class="lead">このPreviewではProductionの棚もNeonも変更しません。画面上の「持ち帰る ↔ 持ち帰り済み」とMY HARF-WAYへの導線だけ確認できます。</p><section class="card"><p class="title" id="title">—</p><p class="note" id="note"></p><button id="run">Previewで反映する</button><p class="sub">本番では中央MY HARF-WAYの匿名棚へ保存／取消されます。このPreview専用ページはProductionには含めません。</p></section></main><script>
const p=new URL(location.href).searchParams;
const mode=String(p.get('mode')||'save').toLowerCase();
const source='ways',sourceOrigin=String(p.get('origin')||''),sourceItemId=String(p.get('source_item')||''),gameId=String(p.get('game')||''),title=String(p.get('title')||'ゲーム');
const valid=sourceOrigin===location.origin&&sourceItemId&&window.opener;
document.querySelector('#title').textContent=title;
document.querySelector('#heading').textContent=mode==='remove'?'持ち帰りを取り消す。':'持ち帰りを確認。';
document.querySelector('#note').textContent=mode==='remove'?'この作品を「持ち帰る」に戻すPreview表示です。':'この作品を「持ち帰り済み」にするPreview表示です。';
document.querySelector('#run').textContent=mode==='remove'?'Previewで取り消す':'Previewで持ち帰る';
document.querySelector('#run').onclick=()=>{
  if(!valid){document.querySelector('#note').textContent='元のWAYS画面を確認できませんでした。';return;}
  const message=mode==='remove'?{type:'hw-remove-result',source,sourceOrigin,contextSource:'ways',sourceItemId,gameId,removed:true}:{type:'hw-save-capability',source,sourceOrigin,contextSource:'ways',sourceItemId,gameId,saved:true,canonicalized:Boolean(gameId)};
  window.opener.postMessage(message,sourceOrigin);
  setTimeout(()=>window.close(),150);
};
</script></body></html>
