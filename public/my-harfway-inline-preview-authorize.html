<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MY HARF-WAY — Inline Preview Auth</title><style>:root{--bg:#0b0c0e;--panel:#14161a;--line:#353941;--text:#f5f6f0;--muted:#969da6;--lime:#eaff3f;--danger:#ffb3aa}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}button{font:inherit}.wrap{width:min(520px,calc(100% - 28px));margin:auto;padding:28px 0 46px}.eyebrow{margin:0 0 10px;color:var(--lime);font:900 10px ui-monospace;letter-spacing:.15em}h1{margin:0;font-size:clamp(36px,9vw,56px);line-height:.94;letter-spacing:-.055em}.lead{margin:14px 0 0;color:var(--muted);font-size:13px;line-height:1.75}.card{margin-top:18px;border:1px solid var(--line);background:var(--panel);padding:20px}.state{color:var(--lime);font:900 10px ui-monospace;letter-spacing:.12em}.message{font-size:13px;line-height:1.75;color:#c9cdd2;margin:13px 0 0}.actions{display:grid;gap:8px;margin-top:18px}.btn{border:1px solid #555b63;background:#17191d;color:var(--text);padding:13px 14px;font-weight:900;cursor:pointer}.btn.primary{background:var(--lime);border-color:var(--lime);color:#111}.recovery{display:none;margin-top:18px;border:1px solid var(--lime);background:#10120d;padding:15px}.recovery.on{display:block}.code{border:1px solid #4a4f56;background:#050606;padding:12px;word-break:break-all;font:800 12px ui-monospace;line-height:1.6}.error{display:none;margin-top:16px;border:1px solid #7c3c36;background:#201311;color:var(--danger);padding:13px;font-size:12px;line-height:1.7}.error.on{display:block}.spinner{display:inline-block;width:12px;height:12px;border:2px solid #5d626a;border-top-color:var(--lime);border-radius:50%;animation:spin .7s linear infinite;margin-right:7px;vertical-align:-2px}@keyframes spin{to{transform:rotate(360deg)}}.foot{margin:14px 0 0;color:#717780;font-size:10px;line-height:1.7}</style></head><body><main class="wrap"><p class="eyebrow">ISOLATED PREVIEW / TAKE-HOME TOGGLE</p><h1 id="heading">持ち帰る準備。</h1><p class="lead">検証用の隔離Neonだけを使います。保存と取り消しの両方をProductionから分離して確認します。</p><section class="card"><div class="state" id="state"><span class="spinner"></span>確認しています</div><p class="message" id="message">Preview棚を確認しています。</p><div class="actions" id="actions"></div><div class="recovery" id="recovery"><h2>Preview復旧コード</h2><p>本番データではありません。</p><div class="code" id="recoveryCode"></div><div class="actions"><button class="btn" id="copyRecovery">コードをコピー</button><button class="btn primary" id="finish">確認したのでWAYSへ戻る</button></div></div><div class="error" id="error"></div><p class="foot">解除権限は1作品だけに限定されます。このPreviewページは本番リリースには含めません。</p></section></main><script>
const DEVICE_KEY='hw_my_harfway_preview_device_v1',source='ways',context='ways';
const p=new URL(location.href).searchParams,mode=String(p.get('mode')||'save'),sourceOrigin=String(p.get('origin')||''),gameId=String(p.get('game')||''),steamAppid=String(p.get('steam')||''),sourceItemId=String(p.get('source_item')||''),title=String(p.get('title')||''),storeUrl=String(p.get('store')||'');
const $=s=>document.querySelector(s);let resultMessage=null;
function setState(text,busy=false){$('#state').innerHTML=busy?`<span class="spinner"></span>${text}`:text}
function showError(text){$('#error').textContent=text;$('#error').classList.add('on');setState('ERROR');$('#actions').innerHTML='<button class="btn" id="closeBtn">閉じる</button>';$('#closeBtn').onclick=()=>window.close()}
async function jsonCall(path,body,token=''){const headers={'content-type':'application/json'};if(token)headers.authorization=`Bearer ${token}`;const r=await fetch(path,{method:'POST',headers,body:JSON.stringify(body),cache:'no-store'});const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={ok:false,error:'invalid_json'}}return{ok:r.ok,status:r.status,data}}
function readDevice(){try{return String(localStorage.getItem(DEVICE_KEY)||'')}catch{return''}}function storeDevice(t){try{localStorage.setItem(DEVICE_KEY,String(t||''))}catch{}}
function validContext(){if(sourceOrigin!==location.origin||!sourceItemId||!title||!window.opener)return false;try{if(document.referrer&&new URL(document.referrer).origin!==location.origin)return false}catch{return false}return true}
function identity(){return{source,sourceOrigin,contextSource:context,gameId,steamAppid,sourceItemId,title,storeUrl}}
async function issueAndSave(deviceToken){const issued=await jsonCall('/api/my-harfway/save-capability',{action:'issue',source,sourceOrigin},deviceToken);if(!issued.ok||!issued.data?.capabilityToken)throw Error(issued.data?.error||'保存権限を発行できませんでした');const cap=String(issued.data.capabilityToken);const saved=await jsonCall('/api/my-harfway/save-capability',{action:'save',...identity()},cap);if(!saved.ok)throw Error(saved.data?.error||'ゲームを保存できませんでした');return{type:'hw-save-capability',source,sourceOrigin,contextSource:context,sourceItemId,gameId:String(saved.data?.gameId||saved.data?.game?.id||''),saved:true,capabilityToken:cap,expiresAt:String(issued.data?.expiresAt||''),removeCapabilityToken:String(saved.data?.removeCapabilityToken||''),removeGameId:String(saved.data?.removeGameId||saved.data?.gameId||''),removeExpiresAt:String(saved.data?.removeExpiresAt||'')}}
async function removeExisting(deviceToken){const issued=await jsonCall('/api/my-harfway/save-capability',{action:'issue_remove',...identity()},deviceToken);if(!issued.ok||!issued.data?.removeCapabilityToken)throw Error(issued.data?.error||'取り消し権限を発行できませんでした');const removed=await jsonCall('/api/my-harfway/save-capability',{action:'remove',savedGameId:issued.data.removeGameId},String(issued.data.removeCapabilityToken));if(!removed.ok||!removed.data?.removed)throw Error(removed.data?.error||'持ち帰りを取り消せませんでした');return{type:'hw-remove-result',source,sourceOrigin,contextSource:context,sourceItemId,gameId:String(removed.data.gameId||issued.data.removeGameId||''),removed:true}}
function sendAndClose(){if(!resultMessage)throw Error('処理結果がありません');window.opener.postMessage(resultMessage,sourceOrigin);setState(resultMessage.removed?'CANCELED':'SAVED');$('#message').textContent=resultMessage.removed?'持ち帰りを取り消しました。WAYSへ戻ります。':'持ち帰りました。WAYSへ戻ります。';setTimeout(()=>window.close(),260)}
async function createPreviewWorkspace(){setState('Preview棚を作っています',true);const created=await jsonCall('/api/my-harfway/workspace',{action:'create',label:'Take-home Toggle Preview'});if(!created.ok||!created.data?.deviceToken)throw Error(created.data?.error||'Preview棚を作成できませんでした');storeDevice(created.data.deviceToken);resultMessage=await issueAndSave(created.data.deviceToken);const recovery=String(created.data?.recoveryCode||'');if(recovery){$('#recoveryCode').textContent=recovery;$('#recovery').classList.add('on');setState('FIRST SAVE COMPLETE');$('#message').textContent='持ち帰りました。復旧コードを確認したらWAYSへ戻ってください。';$('#actions').innerHTML='';return}sendAndClose()}
async function init(){try{if(!validContext())throw Error('WAYSの元画面を確認できません');const token=readDevice();if(mode==='remove'){$('#heading').textContent='持ち帰りを取り消す。';if(!token)throw Error('このPreview棚の端末情報がありません');setState('取り消しています',true);resultMessage=await removeExisting(token);sendAndClose();return}if(token){setState('既存Preview棚へ保存しています',true);resultMessage=await issueAndSave(token);sendAndClose();return}setState('FIRST TAKE HOME');$('#message').textContent='初回だけ匿名のPreview棚を作ります。';$('#actions').innerHTML='<button class="btn primary" id="createBtn">Preview棚を作って持ち帰る</button><button class="btn" id="cancelBtn">今回はやめる</button>';$('#createBtn').onclick=()=>createPreviewWorkspace().catch(e=>showError(e.message));$('#cancelBtn').onclick=()=>window.close()}catch(e){showError(e.message||'処理に失敗しました')}}
$('#copyRecovery').onclick=async()=>{try{await navigator.clipboard.writeText($('#recoveryCode').textContent);$('#copyRecovery').textContent='コピーしました ✓'}catch{$('#copyRecovery').textContent='コピーできませんでした'}};$('#finish').onclick=()=>{try{sendAndClose()}catch(e){showError(e.message)}};init();
</script></body></html>
