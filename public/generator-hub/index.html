<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>HARF-WAY GENERATOR HUB</title>
<style>html,body{margin:0;min-height:100%;background:#e9eceb}.boot{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;padding:24px;color:#192724;font-weight:700}</style>
</head>
<body>
<div class="boot">GENERATOR HUB を読み込んでいます…</div>
<script>
(async()=>{
  try{
    const urls=Array.from({length:17},(_,i)=>`payload-${String(i+1).padStart(2,'0')}.txt`);
    const b64=(await Promise.all(urls.map(async u=>{const r=await fetch(u,{cache:'force-cache'});if(!r.ok)throw new Error(`${u}: ${r.status}`);return r.text()}))).join('');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    let html=await new Response(stream).text();
    html=html.replace('<meta name="viewport" content="width=device-width,initial-scale=1">','<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">');
    html=html.replace('</nav>','<button type="button" onclick="location.href=\'/generator-hub/steam-trailer.html\'">Steam Trailer</button></nav>');
    html=html.replace('</div>\n    <div class="backup"><h3>全体バックアップ</h3>','<article class="dash-card"><small>STEAM TRAILER</small><h3>Steam Trailer Generator</h3><p>SteamストアURLから公式トレーラーを取得し、WordPress用の動画＋出典リンクHTMLを生成します。</p><button class="btn primary wide" type="button" onclick="location.href=\'/generator-hub/steam-trailer.html\'">開く</button></article></div>\n    <div class="backup"><h3>全体バックアップ</h3>');
    document.open();document.write(html);document.close();
  }catch(err){
    document.body.innerHTML='<pre style="white-space:pre-wrap;padding:24px;font-family:ui-monospace,monospace">GENERATOR HUB load error\n'+String(err)+'</pre>';
  }
})();
</script>
</body>
</html>
