<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><title>WAYS / ARCHIVE</title><style>:root{--bg:#090909;--panel:#111214;--line:#292b30;--text:#f5f5ef;--muted:#8f939b;--accent:#efff35}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}a,button,input{font:inherit}body{min-height:100vh}.wrap{max-width:1480px;margin:auto;padding:28px 24px 70px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:1px solid var(--line);padding-bottom:22px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--accent);font-weight:900}.top h1{font-size:clamp(42px,7vw,88px);line-height:.86;letter-spacing:-.065em;margin:8px 0 0}.top h1 span{color:var(--accent)}.back{border:1px solid #3a3d44;color:#ddd;text-decoration:none;border-radius:999px;padding:9px 12px;font-size:10px}.controls{position:sticky;top:0;z-index:5;background:#090909ee;backdrop-filter:blur(12px);padding:18px 0 14px;border-bottom:1px solid var(--line)}.searchrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.search{width:100%;background:#111214;border:1px solid #30333a;color:#fff;padding:14px 16px;border-radius:10px;outline:none}.search:focus{border-color:var(--accent)}.count{display:grid;place-items:center;min-width:100px;border:1px solid #30333a;border-radius:10px;color:#8e929a;font:11px ui-monospace,monospace}.chips{display:flex;gap:7px;overflow:auto;padding-top:12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid #33363d;background:transparent;color:#aaa;border-radius:999px;padding:7px 10px;font-size:10px;cursor:pointer}.chip.on{background:var(--accent);border-color:var(--accent);color:#111;font-weight:900}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 16px;padding-top:26px}.card{min-width:0}.thumb{aspect-ratio:16/9;background:#111;border:1px solid #292c32;overflow:hidden;position:relative}.thumb video,.thumb canvas,.thumb img{position:absolute;inset:0;width:100%;height:100%;display:block}.thumbimg{object-fit:cover;filter:saturate(.9) brightness(.88)}.thumb video{object-fit:cover;filter:saturate(.9) brightness(.8)}.thumb canvas{object-fit:cover;opacity:0;transition:opacity .12s}.thumb.ready canvas{opacity:1}.thumb.ready video{opacity:0}.thumb.previewing canvas,.thumb.previewing img{opacity:0}.thumb.previewing video{opacity:1}.card:hover .thumb{border-color:#737780}.meta{padding:9px 2px 0}.title{font-size:14px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.genre{font-size:9px;color:#777;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.tag{border:1px solid #34373d;color:#9da1a8;background:transparent;border-radius:999px;padding:4px 7px;font-size:8px;cursor:pointer}.links{display:flex;gap:7px;margin-top:9px}.links a{font-size:9px;text-decoration:none;padding:6px 8px}.store{background:var(--accent);color:#111;font-weight:900}.article{border:1px solid #3d4047;color:#ddd}.empty{padding:80px 0;color:#777;font-size:13px}.grouphead{grid-column:1/-1;font-size:11px;letter-spacing:.12em;color:var(--accent);border-bottom:1px solid var(--line);padding:14px 0 8px;margin-top:12px}.modebar{display:flex;gap:7px;margin-top:12px}.mode{border:1px solid #33363d;background:transparent;color:#aaa;border-radius:999px;padding:7px 10px;font-size:9px;cursor:pointer}.mode.on{color:#111;background:#fff;border-color:#fff;font-weight:900}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:720px){.wrap{padding:20px 14px 55px}.top{align-items:flex-start}.top h1{font-size:48px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 10px}.searchrow{grid-template-columns:1fr}.count{min-height:36px}.title{font-size:12px}.controls{top:0}.back{font-size:9px}.genre{font-size:8px}}@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><header class="top"><div><div class="eyebrow">HARF-WAY / GAME DISCOVERY</div><h1>WAYS <span>/ ARCHIVE</span></h1></div><a class="back" href="/">← DIG SHELF</a></header><section class="controls"><div class="searchrow"><input id="q" class="search" type="search" placeholder="ゲーム名・紹介文・タグ・ジャンルから検索"><div id="count" class="count">-- GAMES</div></div><div class="modebar"><button class="mode on" data-mode="flat">一覧</button><button class="mode" data-mode="genre">ジャンル別</button><button class="mode" data-mode="tag">タグ別</button></div><div id="chips" class="chips"></div></section><main id="grid" class="grid"><div class="empty">読み込み中…</div></main></div><script>const API='https://harfway-playback.vercel.app/api/games';let items=[],active='',mode='flat';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tags=x=>Array.isArray(x.tags)?x.tags.map(v=>String(v||'').trim()).filter(Boolean):[];const genres=x=>String(x.category||'').split('/').map(v=>v.trim()).filter(Boolean);function match(x){const q=$('#q').value.trim().toLowerCase();if(active&&![...tags(x),...genres(x)].includes(active))return false;if(!q)return true;return [x.title,x.description,x.category,...tags(x)].join(' ').toLowerCase().includes(q)}function card(x){return `<article class="card"><div class="thumb">${x.thumbnailUrl?`<img class="thumbimg" loading="lazy" src="${esc(x.thumbnailUrl)}" alt=""><video class="hovervideo" muted playsinline preload="none" data-src="${esc(x.video)}"></video>`:`<canvas aria-hidden="true"></canvas><video muted playsinline preload="none" data-src="${esc(x.video)}#t=0.12"></video>`}</div><div class="meta"><div class="title">${esc(x.title)}</div>${x.category?`<div class="genre">${esc(x.category)}</div>`:''}${tags(x).length?`<div class="tags">${tags(x).map(t=>`<button class="tag" data-chip="${esc(t)}"># ${esc(t)}</button>`).join('')}</div>`:''}<div class="links">${x.storeUrl?`<a class="store" href="${esc(x.storeUrl)}" target="_blank" rel="noopener">STORE ↗</a>`:''}${x.articleUrl?`<a class="article" href="${esc(x.articleUrl)}" target="_blank" rel="noopener">ARTICLE ↗</a>`:''}</div></div></article>`}function groups(list){if(mode==='flat')return [{name:'',list}];const map=new Map();list.forEach(x=>{const keys=mode==='tag'?tags(x):genres(x);(keys.length?keys:['未分類']).forEach(k=>{if(!map.has(k))map.set(k,[]);map.get(k).push(x)})});return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ja')).map(([name,list])=>({name,list}))}function snapshotThumb(v){
const thumb=v.closest('.thumb'),c=thumb?.querySelector('canvas');
if(!thumb||!c||!v.videoWidth||!v.videoHeight)return false;
try{
c.width=v.videoWidth;c.height=v.videoHeight;
const ctx=c.getContext('2d');ctx.drawImage(v,0,0,c.width,c.height);
thumb.classList.add('ready');
thumb.classList.remove('previewing');
v.pause();
return true;
}catch{return false}
}
function primeThumb(v){
if(v.dataset.primed)return;v.dataset.primed='1';
if(!v.src&&v.dataset.src){v.src=v.dataset.src;v.removeAttribute('data-src')}
v.muted=true;v.defaultMuted=true;v.setAttribute('muted','');v.setAttribute('playsinline','');
const grab=()=>{
if(snapshotThumb(v))return;
try{if(v.currentTime<0.08)v.currentTime=0.12}catch{}
const p=v.play();
if(p&&typeof p.catch==='function')p.catch(()=>{});
if('requestVideoFrameCallback' in v){v.requestVideoFrameCallback(()=>snapshotThumb(v));}
else{const done=()=>{snapshotThumb(v);v.removeEventListener('timeupdate',done);v.removeEventListener('seeked',done)};v.addEventListener('timeupdate',done);v.addEventListener('seeked',done)}
};
if(v.readyState>=2)grab();else{v.addEventListener('loadeddata',grab,{once:true});v.addEventListener('canplay',grab,{once:true})}
try{v.load()}catch{}
}
function setupThumbs(){
const videos=[...$('#grid').querySelectorAll('video')];
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){primeThumb(en.target);io.unobserve(en.target)}}),{rootMargin:'500px 0px'}):null;
videos.forEach(v=>{
const thumb=v.closest('.thumb'),hasImg=!!thumb?.querySelector('.thumbimg');
if(!hasImg){if(io)io.observe(v);else primeThumb(v)}
thumb?.addEventListener('mouseenter',()=>{if(v.dataset.src){v.src=v.dataset.src;v.removeAttribute('data-src')}thumb.classList.add('previewing');v.muted=true;v.play().catch(()=>{})});
thumb?.addEventListener('mouseleave',()=>{v.pause();thumb.classList.remove('previewing');if(!hasImg&&!thumb.classList.contains('ready'))snapshotThumb(v)});
});
}
function render(){const list=items.filter(match);$('#count').textContent=`${list.length} GAMES`;const gs=groups(list);$('#grid').innerHTML=list.length?gs.map(g=>(g.name?`<div class="grouphead">${mode==='tag'?'# ':''}${esc(g.name)} · ${g.list.length}</div>`:'')+g.list.map(card).join('')).join(''):'<div class="empty">該当する作品がありません。</div>';setupThumbs();}function renderChips(){const vals=[...new Set(items.flatMap(x=>[...tags(x),...genres(x)]))].sort((a,b)=>a.localeCompare(b,'ja'));$('#chips').innerHTML=`<button class="chip ${!active?'on':''}" data-chip="">ALL</button>`+vals.map(v=>`<button class="chip ${v===active?'on':''}" data-chip="${esc(v)}">${tags({tags:[v]}).length?'# ':''}${esc(v)}</button>`).join('')}$('#q').oninput=render;$('#chips').onclick=e=>{const b=e.target.closest('[data-chip]');if(!b)return;active=b.dataset.chip;renderChips();render()};$('#grid').onclick=e=>{const b=e.target.closest('[data-chip]');if(!b)return;active=b.dataset.chip;renderChips();render();scrollTo({top:0,behavior:'smooth'})};document.querySelector('.modebar').onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('on',x===b));render()};fetch(API,{cache:'no-store'}).then(r=>r.json()).then(d=>{items=(d.entries||[]).filter(x=>x.video);renderChips();render()}).catch(()=>{$('#grid').innerHTML='<div class="empty">読み込みに失敗しました。</div>'});</script></body></html>
