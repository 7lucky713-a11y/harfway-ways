</style></head><body><div class="orientation-preview" id="orientationPreview"><span class="op-label">VIDEO LAYOUT</span><button class="on" data-orient="auto">AUTO</button><button data-orient="landscape">横 16:9</button><button data-orient="portrait">縦 9:16</button><span class="op-state" id="orientationState">AUTO</span></div><main class="desktop"><header class="mast"><div><div class="eyebrow">HARF-WAY / GAME DISCOVERY</div><h1>WAYS <span>/ DIG SHELF</span></h1></div><div class="mast-right"><p>流れてくるのを待たずに、棚から気になる一本を取る。<br>選んだ作品だけ、大きく再生します。</p><div id="shelfContext" class="shelf-context"></div></div></header><section class="workspace"><div class="left"><div class="stage"><div class="video-frame"><video id="mainVideo" muted playsinline loop preload="auto"></video><div class="stage-top"><span class="badge acid">TAKEN FROM SHELF</span><span id="stageLabel" class="badge">DIG</span></div><div class="stage-controls"><button id="sound" class="icon" title="音声">🔇</button><button id="pause" class="icon" title="再生 / 一時停止">⏸</button></div><div class="progress"><i id="progress"></i></div></div></div><div class="shelf-wrap"><div id="shelf" class="shelf"><div style="color:#777;font-size:12px">棚を読み込み中…</div></div><div class="shelf-line"></div><div class="shelf-pager" id="shelfPager"><button id="shelfPrevPage">← 前の10作品</button><span class="page-label" id="shelfPageLabel">1/1</span><button id="shelfMore" class="primary">次の10作品を読み込む →</button></div></div></div><aside class="side"><div class="now">NOW PLAYING</div><div id="count" class="count">-- / --</div><h2 id="title">作品を選んでください</h2><div id="desc" class="desc">棚から気になる作品をクリックすると、ここにそのゲームの情報が表示されます。</div><div id="tags" class="tags"></div><div id="links" class="links"></div><div class="dig-note">HOVER：先読み　／　CLICK：棚から取る　／　SPACE：再生・停止<div class="nav"><button id="prev">← 前の作品</button><button id="random">ランダムに掘る</button><button id="next">次の作品 →</button></div></div></aside></section></main><main class="mobile"><div class="m-tools"><a href="/archive/">ARCHIVE</a><button id="mSound">SOUND OFF</button></div><div id="mfeed" class="m-feed"><div style="height:100dvh;display:grid;place-items:center;color:#777">読み込み中…</div></div></main><script>const API='https://harfway-playback.vercel.app/api/games';
let items=[],filtered=[],selected=0,muted=true,userPaused=false,activeTag='',mobileMuted=true,orientationOverride='auto';
let shelfPage=0,mobileRendered=0,mobileObserver=null,mainReady=false,warmTimer=0;
const SHELF_SIZE=10,MOBILE_INITIAL=2,MOBILE_BATCH=2;
const warmers=new Map();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tagsOf(x){return Array.isArray(x.tags)?x.tags.map(v=>String(v||'').trim()).filter(Boolean):[]}
function primaryTag(x){return tagsOf(x)[0]||''}
function text(x){return x.description||x.reason||''}
function detectedOrientation(x){if(x?.videoOrientation)return x.videoOrientation;if(Number(x?.videoWidth)&&Number(x?.videoHeight))return Number(x.videoHeight)>Number(x.videoWidth)?'portrait':'landscape';return ''}
function displayOrientation(x){if(orientationOverride!=='auto')return orientationOverride;return x?.videoLayoutMode&&x.videoLayoutMode!=='auto'?x.videoLayoutMode:(detectedOrientation(x)||'landscape')}
function applyMainOrientation(x){const f=document.querySelector('.video-frame');if(!f)return;f.classList.remove('portrait','landscape');f.classList.add(displayOrientation(x))}
function updateOrientationPreview(){const x=filtered[selected]||items[0]||{};document.querySelectorAll('[data-orient]').forEach(b=>b.classList.toggle('on',b.dataset.orient===orientationOverride));const actual=detectedOrientation(x)||'未判定';const saved=x?.videoLayoutMode||'auto';const out=$('#orientationState');if(out)out.textContent=orientationOverride==='auto'?`AUTO → ${displayOrientation(x)==='portrait'?'縦':'横'}（判定:${actual==='portrait'?'縦':actual==='landscape'?'横':'未判定'} / 保存:${saved}）`:`強制 → ${orientationOverride==='portrait'?'縦 9:16':'横 16:9'}`;}
function applyOrientationToExistingDOM(){const x=filtered[selected]||items[0]||{};applyMainOrientation(x);document.querySelectorAll('#shelf .game').forEach(b=>{const i=Number(b.dataset.i),cover=b.querySelector('.cover'),g=filtered[i];if(!cover||!g)return;cover.classList.remove('portrait','landscape');cover.classList.add(displayOrientation(g))});const list=activeTag?filtered:items;document.querySelectorAll('#mfeed .m-card').forEach(c=>{const i=Number(c.dataset.i),g=list[i];if(!g)return;c.classList.remove('portrait','landscape');c.classList.add(displayOrientation(g))})}
function setOrientationPreview(mode){orientationOverride=['auto','landscape','portrait'].includes(mode)?mode:'auto';applyOrientationToExistingDOM();updateOrientationPreview();}
document.querySelector('#orientationPreview')?.addEventListener('click',e=>{const b=e.target.closest('[data-orient]');if(b)setOrientationPreview(b.dataset.orient)});
function shelfPages(){return Math.max(1,Math.ceil(filtered.length/SHELF_SIZE))}
function renderShelfContext(){const c=$('#shelfContext');if(!c)return;const page=`${Math.min(shelfPage+1,shelfPages())}/${shelfPages()}`;if(activeTag){c.innerHTML=`<a class="archive-link" href="/archive/">ARCHIVE</a><button class="context-back" data-reset>← ALL SHELF</button><span class="context-pill active"># ${esc(activeTag)} · ${filtered.length} GAMES · ${page}</span>`}else{c.innerHTML=`<a class="archive-link" href="/archive/">ARCHIVE</a><span class="context-pill">ALL SHELF · ${items.length} GAMES · ${page}</span>`}}
function setTagShelf(tag,keepId=''){activeTag=String(tag||'').trim();filtered=activeTag?items.filter(x=>tagsOf(x).includes(activeTag)):items.slice();let next=keepId?filtered.findIndex(x=>x.id===keepId):0;if(next<0)next=0;selected=next;shelfPage=Math.floor(selected/SHELF_SIZE);clearWarmers();renderShelfContext();updateShelfPager();resetShelfRender();if(innerWidth>=900){select(selected,true);startShelfAfterMain()}else{mobile(true)}document.querySelector('.shelf-wrap')?.scrollTo({top:0,behavior:'smooth'})}
function resetShelf(){setTagShelf('',filtered[selected]?.id||'')}
$('#shelfContext').onclick=e=>{if(e.target.closest('[data-reset]'))resetShelf()};
let shelfObserver=null;
function ensureVideoSource(v){if(v.src||!v.dataset.src)return;v.src=v.dataset.src;v.removeAttribute('data-src');try{v.load()}catch{}}
function thumbReady(v){const setFrame=()=>{try{if(v.duration&&Number.isFinite(v.duration))v.currentTime=Math.min(.25,Math.max(.05,v.duration*.02))}catch{}};v.addEventListener('loadeddata',setFrame,{once:true});v.addEventListener('loadedmetadata',setFrame,{once:true})}
function setupShelfLazy(scope){if(shelfObserver)shelfObserver.disconnect();const root=document.querySelector('.shelf-wrap');shelfObserver=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){const v=en.target.querySelector('video');if(v&&!en.target.querySelector('.coverimg'))ensureVideoSource(v);shelfObserver.unobserve(en.target)}}),{root,rootMargin:'80px 0px',threshold:.01});scope.querySelectorAll('.game').forEach(b=>{const i=Number(b.dataset.i),v=b.querySelector('video'),cover=b.querySelector('.cover'),hasImg=!!cover?.querySelector('.coverimg');if(v)thumbReady(v);if(v&&!hasImg)shelfObserver.observe(b);b.onmouseenter=()=>{if(!v)return;warmIndex(i);ensureVideoSource(v);cover?.classList.add('previewing');v.play().catch(()=>{});clearTimeout(v._waysTimer);v._waysTimer=setTimeout(()=>v.pause(),1600)};b.onmouseleave=()=>{if(!v)return;clearTimeout(v._waysTimer);v.pause();cover?.classList.remove('previewing');try{if(v.readyState>=2)v.currentTime=Math.min(.25,v.duration||.25)}catch{}};b.onclick=()=>select(i,false)})}
function shelfCard(x,i){return `<button class="game ${i===selected?'on':''}" data-i="${i}"><div class="cover ${displayOrientation(x)}">${x.thumbnailUrl?`<img class="coverimg" loading="lazy" decoding="async" src="${esc(x.thumbnailUrl)}" alt=""><video class="hovervideo" muted playsinline preload="none" data-src="${esc(x.video)}"></video>`:`<video muted playsinline preload="none" data-src="${esc(x.video)}"></video>`}<span class="num">${String(i+1).padStart(2,'0')}</span><span class="take">TAKE</span></div><div class="gtitle">${esc(x.title)}</div>${primaryTag(x)?`<div class="glabel"># ${esc(primaryTag(x))}</div>`:''}</button>`}
function resetShelfRender(){const box=$('#shelf');if(box)box.innerHTML='<div style="color:#777;font-size:12px">まず動画を再生します…</div>'}
function updateShelfNav(){const prev=$('#prev'),next=$('#next'),many=filtered.length>1;if(prev){prev.disabled=!many;prev.textContent='← 前の作品'}if(next){next.disabled=!many;next.textContent='次の作品 →'}}
function updateShelfPager(){const pages=shelfPages(),prev=$('#shelfPrevPage'),more=$('#shelfMore'),label=$('#shelfPageLabel');if(label)label.textContent=`${Math.min(shelfPage+1,pages)}/${pages}`;if(prev)prev.disabled=shelfPage<=0;if(more){if(pages<=1){more.disabled=true;more.textContent='この棚ですべて表示中'}else if(shelfPage>=pages-1){more.disabled=false;more.textContent='最初の10作品に戻る ↺'}else{const remain=Math.min(SHELF_SIZE,filtered.length-(shelfPage+1)*SHELF_SIZE);more.disabled=false;more.textContent=`次の${remain}作品を読み込む →`}}}
function renderShelfPage(force=false){const box=$('#shelf');if(!box||!filtered.length)return;if(!mainReady&&!force){resetShelfRender();return}const from=shelfPage*SHELF_SIZE,to=Math.min(filtered.length,from+SHELF_SIZE);box.innerHTML=filtered.slice(from,to).map((x,j)=>shelfCard(x,from+j)).join('');setupShelfLazy(box);updateShelfNav();updateShelfPager();renderShelfContext();document.querySelector('.shelf-wrap')?.scrollTo({top:0,behavior:'auto'})}
function changeShelfPage(delta){const next=Math.max(0,Math.min(shelfPages()-1,shelfPage+delta));if(next===shelfPage)return;shelfPage=next;renderShelfPage(true)}
function nextShelfPage(){const pages=shelfPages();if(pages<=1)return;shelfPage=shelfPage>=pages-1?0:shelfPage+1;renderShelfPage(true)}
function clearWarmers(keepUrls=new Set()){clearTimeout(warmTimer);for(const [url,v] of warmers){if(keepUrls.has(url))continue;try{v.pause();v.removeAttribute('src');v.load()}catch{}warmers.delete(url)}}
function warmIndex(i){const x=filtered[i];if(!x?.video||i===selected)return;const url=x.video;if(warmers.has(url))return;const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src=url;warmers.set(url,v);try{v.load()}catch{}if(warmers.size>6){const first=warmers.keys().next().value;if(first&&first!==url){const old=warmers.get(first);try{old.removeAttribute('src');old.load()}catch{}warmers.delete(first)}}}
function warmAround(i){clearTimeout(warmTimer);warmTimer=setTimeout(()=>{const ids=[i-2,i-1,i+1,i+2].filter(n=>n>=0&&n<filtered.length);const keep=new Set(ids.map(n=>filtered[n]?.video).filter(Boolean));clearWarmers(keep);ids.forEach(warmIndex)},280)}
function startShelfAfterMain(){if(innerWidth<900)return;if(mainReady){renderShelfPage(true);warmAround(selected);return}const v=$('#mainVideo');let done=false;const go=()=>{if(done)return;done=true;mainReady=true;renderShelfPage(true);warmAround(selected)};if(v.readyState>=3)go();else{v.addEventListener('playing',go,{once:true});v.addEventListener('canplay',go,{once:true});setTimeout(go,1600)}}
function select(i,quiet=false){if(!filtered.length)return;selected=(i+filtered.length)%filtered.length;const targetPage=Math.floor(selected/SHELF_SIZE),pageChanged=targetPage!==shelfPage;shelfPage=targetPage;if(mainReady&&pageChanged)renderShelfPage(true);else{document.querySelectorAll('.game').forEach(g=>g.classList.toggle('on',Number(g.dataset.i)===selected));updateShelfNav();updateShelfPager();renderShelfContext()}const x=filtered[selected];$('#title').textContent=x.title||'';$('#count').textContent=`${String(selected+1).padStart(2,'0')} / ${String(filtered.length).padStart(2,'0')}${activeTag?` · #${activeTag}`:''}`;$('#desc').textContent=text(x)||'';$('#stageLabel').textContent=primaryTag(x);const t=tagsOf(x);$('#tags').innerHTML=t.length?t.map(v=>`<button class="tag ${v===activeTag?'active':''}" data-tag="${esc(v)}"># ${esc(v)}</button>`).join(''):'<span class="tag-empty">タグ未設定</span>';$('#links').innerHTML=(x.storeUrl?`<a class="store" target="_blank" rel="noopener" href="${esc(x.storeUrl)}">STORE ↗</a>`:'')+(x.articleUrl?`<a class="article" target="_blank" rel="noopener" href="${esc(x.articleUrl)}">ARTICLE ↗</a>`:'');const v=$('#mainVideo');applyMainOrientation(x);updateOrientationPreview();v.onloadedmetadata=()=>{if(orientationOverride==='auto'&&!detectedOrientation(x)&&x.videoLayoutMode==='auto'){const o=v.videoHeight>v.videoWidth?'portrait':'landscape';const f=document.querySelector('.video-frame');f?.classList.remove('portrait','landscape');f?.classList.add(o);updateOrientationPreview()}};const nextSrc=x.video||'',currentSrc=v.getAttribute('src')||'';v.muted=muted;if(currentSrc!==nextSrc){mainReady=false;const keep=new Set([nextSrc]);clearWarmers(keep);v.src=nextSrc;userPaused=false;$('#pause').textContent='⏸';v.play().catch(()=>{});startShelfAfterMain()}else if(!userPaused&&v.paused){v.play().catch(()=>{});warmAround(selected)}else{warmAround(selected)}if(!quiet)document.querySelector('.stage').scrollIntoView({behavior:'smooth',block:'nearest'})}
$('#tags').onclick=e=>{const b=e.target.closest('[data-tag]');if(!b)return;const current=filtered[selected]?.id||'';setTagShelf(b.dataset.tag,current)};
function togglePause(){const v=$('#mainVideo');if(v.paused){userPaused=false;v.play().catch(()=>{});$('#pause').textContent='⏸'}else{userPaused=true;v.pause();$('#pause').textContent='▶'}}
$('#pause').onclick=togglePause;$('#mainVideo').onclick=togglePause;
$('#sound').onclick=()=>{muted=!muted;$('#mainVideo').muted=muted;$('#sound').textContent=muted?'🔇':'🔊';if(!muted&&!userPaused)$('#mainVideo').play().catch(()=>{})};
$('#mainVideo').ontimeupdate=()=>{const v=$('#mainVideo');if(v.duration)$('#progress').style.width=(v.currentTime/v.duration*100)+'%'};
$('#mainVideo').onended=()=>{const v=$('#mainVideo');if(!userPaused){try{v.currentTime=0}catch{}v.play().catch(()=>{})}};
$('#prev').onclick=()=>select(selected-1);$('#next').onclick=()=>select(selected+1);$('#shelfPrevPage').onclick=()=>changeShelfPage(-1);$('#shelfMore').onclick=()=>nextShelfPage();$('#shelfMore').onmouseenter=()=>{const pages=shelfPages();if(pages<=1)return;const p=shelfPage>=pages-1?0:shelfPage+1;const start=p*SHELF_SIZE;[start,start+1].filter(i=>i<filtered.length).forEach(warmIndex)};$('#random').onclick=()=>{if(filtered.length<2)return;let n=selected;while(n===selected)n=Math.floor(Math.random()*filtered.length);select(n)};
window.addEventListener('keydown',e=>{if(e.code==='Space'&&innerWidth>=900&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){e.preventDefault();togglePause()}});
function currentMobileVideo(){const cards=[...document.querySelectorAll('.m-card')];return cards.map(c=>c.querySelector('video')).find(v=>{const r=v.getBoundingClientRect();return r.top<innerHeight*.55&&r.bottom>innerHeight*.45})||cards[0]?.querySelector('video')||null}
function syncMobileSound(){const b=$('#mSound');if(!b)return;b.textContent=mobileMuted?'SOUND OFF':'SOUND ON';b.classList.toggle('on',!mobileMuted);document.querySelectorAll('.m-card video').forEach(v=>v.muted=mobileMuted)}
$('#mSound').onclick=()=>{mobileMuted=!mobileMuted;syncMobileSound();const v=currentMobileVideo();if(v){v.muted=mobileMuted;v.play().catch(()=>{})}};
function mobileCard(x,i){return `<section class="m-card ${displayOrientation(x)}" data-i="${i}"><video muted playsinline loop preload="none" ${x.thumbnailUrl?`poster="${esc(x.thumbnailUrl)}"`:''} data-src="${esc(x.video)}"></video><div class="m-brand">WAYS <b>/ DIG</b></div><button class="m-pause">⏸</button><div class="m-meta"><h2>${esc(x.title)}</h2><p>${esc(text(x))}</p>${tagsOf(x).length?`<div class="m-tags">${tagsOf(x).map(t=>`<button class="m-tag" data-mtag="${esc(t)}"># ${esc(t)}</button>`).join('')}</div>`:''}${x.storeUrl?`<a href="${esc(x.storeUrl)}" target="_blank" rel="noopener">STORE ↗</a>`:''}</div></section>`}
function observeMobileCards(){const box=$('#mfeed'),cards=[...box.querySelectorAll('.m-card')];if(mobileObserver)mobileObserver.disconnect();mobileObserver=new IntersectionObserver(es=>es.forEach(en=>{const card=en.target,idx=Number(card.dataset.i),v=card.querySelector('video');if(en.intersectionRatio>.05){ensureVideoSource(v);const next=box.querySelector(`.m-card[data-i="${idx+1}"] video`);if(next)ensureVideoSource(next);if(idx>=mobileRendered-2)appendMobileBatch(MOBILE_BATCH)}if(en.intersectionRatio>.7){box.querySelectorAll('.m-card video').forEach(o=>{if(o!==v)o.pause()});v.muted=mobileMuted;v.play().catch(()=>{})}else if(en.intersectionRatio<.2)v.pause()}),{root:box,rootMargin:'45% 0px',threshold:[.05,.2,.7]});cards.forEach(c=>mobileObserver.observe(c));syncMobileSound()}
function appendMobileBatch(count=MOBILE_BATCH){const box=$('#mfeed'),list=activeTag?filtered:items;if(!box||mobileRendered>=list.length)return;const from=mobileRendered,to=Math.min(list.length,from+count);const temp=document.createElement('div');temp.innerHTML=list.slice(from,to).map((x,j)=>mobileCard(x,from+j)).join('');const frag=document.createDocumentFragment();while(temp.firstChild)frag.appendChild(temp.firstChild);box.appendChild(frag);mobileRendered=to;observeMobileCards();if(from===0){const first=box.querySelector('.m-card[data-i="0"] video');if(first){ensureVideoSource(first);first.muted=mobileMuted;first.play().catch(()=>{})}const second=box.querySelector('.m-card[data-i="1"] video');if(second)ensureVideoSource(second)}}
function mobile(reset=false){const box=$('#mfeed');const list=activeTag?filtered:items;if(reset||mobileRendered===0){mobileRendered=0;if(mobileObserver)mobileObserver.disconnect();const context=activeTag?`<div class="m-context"><button data-mreset>← ALL</button><button class="active"># ${esc(activeTag)} · ${list.length}</button></div>`:'';box.innerHTML=context;appendMobileBatch(MOBILE_INITIAL)}box.onclick=e=>{if(e.target.closest('[data-mreset]')){resetShelf();return}const tb=e.target.closest('[data-mtag]');if(tb){e.preventDefault();e.stopPropagation();setTagShelf(tb.dataset.mtag);return}const b=e.target.closest('.m-pause');if(b){const c=b.closest('.m-card'),v=c.querySelector('video');if(v.paused){v.play().catch(()=>{});b.textContent='⏸'}else{v.pause();b.textContent='▶'}}}}
function boot(){shelfPage=0;renderShelfContext();resetShelfRender();updateShelfNav();updateShelfPager();if(innerWidth>=900){selected=0;select(0,true)}else{mobile(true)}updateOrientationPreview()}
fetch(API,{cache:'no-store'}).then(r=>r.json()).then(d=>{items=(d.entries||[]).filter(x=>x.video);filtered=items.slice();boot()}).catch(()=>{$('#shelf').innerHTML='<div style="color:#c66">棚を読み込めませんでした。</div>';$('#mfeed').innerHTML='<div style="height:100dvh;display:grid;place-items:center;color:#c66">読み込みに失敗しました。</div>'});
</script></body></html>
