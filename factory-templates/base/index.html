<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>HARF-WAY Factory Starter</title><style>*{box-sizing:border-box}body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#0b0b0b;color:#f5f5ef;margin:0;min-height:100vh;display:grid;place-items:center}.wrap{width:min(760px,calc(100% - 32px));border:1px solid #303030;background:#111;padding:36px}.eyebrow{font-size:11px;letter-spacing:.18em;color:#777}.type{display:inline-block;margin-top:18px;border:1px solid #444;padding:6px 9px;font-size:10px;letter-spacing:.12em}h1{font-size:clamp(34px,6vw,58px);line-height:1;margin:14px 0 14px}p{color:#999;line-height:1.75}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:22px}.item{border:1px solid #272727;padding:12px;font-size:12px;color:#bbb}.item.on:before{content:'✓ ';color:#fff}.item.off{opacity:.35}.status{margin-top:22px;border-top:1px solid #252525;padding-top:18px;font-size:12px;color:#777}a{color:#fff}@media(max-width:560px){.wrap{padding:24px}.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="eyebrow">HARF-WAY FACTORY / GENERATED STARTER</div><span class="type" id="type">LOADING</span><h1 id="name">HARF-WAY Project</h1><p>Factoryから生成されたプロジェクトです。Previewで確認し、承認後にProductionへ進む運用を前提にしています。</p><div class="grid" id="features"></div><div class="status" id="status">Recipeを確認中…</div></main><script>const labels={admin:'管理画面',metrics:'計測',db:'Neon / DB',r2:'Cloudflare R2',ogp:'OGP / Share',translate:'英語切替',ads:'広告枠',auth:'管理認証'};fetch('/api/factory-recipe').then(r=>r.json()).then(data=>{const recipe=data.recipe||{};document.querySelector('#type').textContent=(recipe.project?.type||'starter').toUpperCase();document.querySelector('#name').textContent=recipe.project?.name||'HARF-WAY Project';const f=recipe.features||{};document.querySelector('#features').innerHTML=Object.entries(labels).map(([k,v])=>`<div class="item ${f[k]?'on':'off'}">${v}</div>`).join('');document.querySelector('#status').textContent=data.ok?'Factory Recipe loaded / Preview ready':'Recipe not supplied yet / Starter ready';}).catch(()=>{document.querySelector('#status').textContent='Starter ready / Recipe endpoint unavailable';});</script></body></html>
